# Model configuration
# Threshold is a config value, not hardcoded in src/
# Change it here to shift the precision/recall tradeoff without touching code.

model:
  path: models/fraud_model.joblib
  version: "1.0.0"

prediction:
  # The probability cutoff above which a transaction is flagged as fraud.
  # 0.5 is almost never right — tune this against your business cost matrix.
  # See docs/06_threshold_optimisation.md for how to calculate the right value.
  threshold: 0.3

features:
  numeric:
    - amount
    - hour_of_day
    - day_of_week
    - transactions_last_1h
    - transactions_last_24h
    - amount_mean_last_24h
    - amount_std_last_24h
  categorical:
    - merchant_category
    - card_type

data:
  raw_path: data/raw/transactions.csv
  processed_path: data/processed/features.csv
  test_size: 0.2
  random_state: 42
